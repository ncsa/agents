# Yanello — a mentoring agent that watches Google Doc(s) and posts coaching comments.
#
# It polls the Doc(s) below for edits and, when a Doc settles, reads it and posts
# guidance as Google Docs comments authored by the signed-in user (see gdoc.py).
# Comments appear live in the open Doc — no reload needed.

# --- what to watch --------------------------------------------------------
# source: gdrive = Google Docs via the Drive API (auth + reading via gdoc.py).
source: gdrive

# Watch specific Doc(s) directly. Each entry may be a pasted Docs URL or a bare ID.
# (Alternatively, set `folder_id:` instead to watch every Google Doc in a folder.)
doc_ids:
  - https://docs.google.com/document/d/1N7DHSNx5s77ELc5cSjzU1lTePeCb87Aj5nOb3lpDWvQ/edit
# folder_id:

# The coaching instruction (see Prompt.md).
prompt: Prompt.md

# Lumen model (served by the NCSA Lumen gateway).
model: glm-5.3

# Polling. A Doc must look unchanged for `stable_polls` consecutive checks after an
# edit is first seen before it is acted on, so the agent waits for the student to
# pause rather than commenting mid-edit. stable_polls: 0 acts immediately.
interval: 15         # seconds between checks (Drive API; no need to poll fast)
stable_polls: 1

# What counts as activity. (removed has nothing to comment on, so added/modified.)
events: [added, modified]

# Guidance style: keep a single unresolved coaching comment open at a time, framed as
# the student's one next step. The agent also always replies in any thread whose last
# message is from someone other than itself (the student), so a conversation can happen;
# it never replies to its own messages. When the student resolves the open comment, the
# next edit earns a new next-step comment.
max_notes: 1

# How much of each Doc's text to send to the model.
max_file_chars: 100000

# On the FIRST run only, treat the Doc(s) already present as new and comment once.
# After that the agent remembers what it handled in .agent_state.json (gitignored),
# so restarting does not re-comment unchanged Docs; it acts only on later edits.
process_existing: true

# Where dry-run previews are written (relative to this config's folder). In normal
# gdrive operation the guidance goes into the Doc as comments, not here.
output_dir: responses

# Assemble the prompt + context WITHOUT calling Lumen (saves a preview to output_dir).
dry_run: false
